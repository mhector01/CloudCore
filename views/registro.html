<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de nuevos servidores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <body class="bg-dark text-white">
        <div class="container mt-5">
            <h1 class="text-center text-success mt-5 mb-4">Registrar Nuevo Servidor</h1>

            <div class="row justify-content-center">

                <div class="col-md-6">
                    <div class="card bg-secondary text-white">
                        <div class="card-body bg-dark p-4 border border-secundary rounded">

                            <form action="/guardar_servidor" method="post">

                                <div class="mb-3">
                                    <label class="form-label text-info">Hostname</label>
                                    <input type="text" name="hostname" class="form-control bg-dark text-white" required placeholder="EJ: SRV-PROD-01">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-info">Direccion IP</label>
                                    <input type="text" name="ip" class="form-control bg-dark text-white" required placeholder="EJ: 192.168.1.1">
                                </div>

                                <div class="mb-4">
                                    <label class="form-label text-info">Sistema operativo</label>
                                    <select name="so" class="form-select bg-dark text-white">
                                        <option value="Windows Server 2022">Windows Server 2022</option>
                                        <option value="Ubuntu 20.04">Ubuntu 20.04</option>
                                        <option value="CentOS 8">CentOS 8</option>
                                    </select>

                                    <div class="text-end mt-4" pt-3 border-top border-secondary>
                                        <a href="/">Cancelar</a>
                                        <button type="submit" class="btn btn-success">Guardar Servidor</button>
                                    </div>
                                </div>
                            
                            </form>

                        </div>

                    </div>

                </div>

            </div>


        </div>

    </body>
</html>
