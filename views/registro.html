<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CloudCore Admin | Registrar Servidor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card bg-seconday text-white shadow-lg border-0">
                    <div class="card-header bg-success bg-opacity-75">
                        <h3 class="mb-0">Registrar Nuevo Servidor</h3>
                    </div>

                    <div class="card-body bg-dark">
                        <form action="/guardar_servidor" method="post">
                            
                            <div class="mb-4">
                                <label for="hostname" class="form-label text-info">Nombre del Host (Hostname)</label>
                                <input type="text" id="hostname" name="hostname" class="form-control bg-dark text-white border-seconday" required placeholder="Ej: SRV-PROD-01">
                            </div>

                            <div class="mb-4">
                                <label for="ip" class="form-label text-info">Dirección IP</label>
                                <input type="text" id="ip" name="ip" class="form-control bg-dark text-white border-seconday" required placeholder="Ej: 192.168.1.10">
                            </div>

                            <div class="mb-4">
                                <label for="ip" class="form-label text-info">Sistempa Operativo</label>
                                <select id="so" name="so" class="form-select bg-dark text-white border-seconday">
                                    <option value="Windows Server 2022">Windows Server 2022</option>
                                    <option value="Ubuntu 22.04 LTS">Ubuntu 22.04 LTS</option>
                                    <option value="CentOS 7">CentOS 7</option>
                                    <option value="Red Hat Enterprise Linux 9">Red Hat Enterprise Linux 9</option>
                                </select>
                            </div>

                             <div class="mb-4">
                                <label for="tipo" class="form-label text-info">Tipo de componente</label>
                                <select id="tipo" name="tipo" class="form-select bg-dark text-white border-seconday">
                                    <option value="CPU">Procesador (CPU)</option>
                                    <option value="RAM">Memoria RAM</option>
                                    <option value="Disco Duro">Almacenamiento</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="capacidad" class="form-label text-info">Capacidad (GB / Cores)</label>
                                <input type="number" id="capacidad" name="capacidad_gb" class="form-control bg-dark text-white border-seconday" required placeholder="Ej: 16">
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
    
</body>
